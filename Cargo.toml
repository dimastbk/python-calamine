[package]
name = "python-calamine"
version = "0.9.1"
edition = "2021"

[lib]
name = "python_calamine"
crate-type = ["cdylib"]

[dependencies]
calamine = { version = "0.37.0", features = ["chrono"] }
pyo3 = { version = "0.30.1", features = ["chrono"] }
chrono = { version = "0.4.42", features = ["serde"] }
pyo3-file = "0.18.0"

[build-dependencies]
pyo3-build-config = "0.30.1"
